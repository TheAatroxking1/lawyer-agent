server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA history fallback; never cache the entry document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Versioned backend API and health probe are reverse-proxied to the API
    # service (same origin, so browser cookies and CSRF origins stay clean).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    location = /health/ready {
        proxy_pass http://api:8000/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
