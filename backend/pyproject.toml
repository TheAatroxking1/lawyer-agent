[project]
name = "lawyer-agent-backend"
version = "0.1.0"
description = "Multi-tenant mainland China legal agent backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "SQLAlchemy[asyncio]>=2.0.52,<2.1",
  "alembic>=1.19.1,<2",
  "asyncmy>=0.2.11,<1",
  "aiomysql>=0.3.2,<0.4; sys_platform == 'win32'",
  "PyMySQL>=1.2.3,<1.3; sys_platform == 'win32'",
  "aio-pika>=10.0.1,<11",
  "redis>=8.1,<9",
  "argon2-cffi>=25.1,<26",
  "cryptography>=48,<50",
  "PyJWT[crypto]>=2.13,<3",
  "email-validator>=2.2,<3",
  "phonenumbers>=9,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "orjson>=3.10,<4",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
embedding-cpu = [
  "sentence-transformers>=6.0.1,<7",
  "torch>=2.14,<2.15",
]
contract-review = [
    "botocore>=1.40,<2",
    "llama-index-core==0.14.24",
    "llama-index-tools-mcp==0.6.0",
    "mcp==2.2.0",
    "jsonschema>=4.23,<5",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30,<6",
    "rapidocr-onnxruntime==1.4.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawyer_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests/integration/mysql", "tests/integration/rabbitmq"]
markers = [
  "integration: requires an external infrastructure service",
  "mysql: requires a disposable MySQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lawyer_agent"]
